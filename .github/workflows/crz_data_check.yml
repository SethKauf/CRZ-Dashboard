name: CRZ Data Check

on:
  schedule:
    - cron: "0 12 * * 2,4,6"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crz-data-pipeline
  cancel-in-progress: false

jobs:
  check-data:
    runs-on: ubuntu-latest

    outputs:
      new_data_available: ${{ steps.check.outputs.new_data_available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check NY Open Data
        id: check
        run: python -m pipelines.check_for_new_data

  update-model:
    needs: check-data
    if: needs.check-data.outputs.new_data_available == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CRZ update pipeline
        run: python -m pipelines.update_pipeline

      - name: Commit updated model and forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/modeling_data.csv \
            models/lstm_traffic_model.keras \
            models/traffic_scaler.joblib \
            src/model_config.json \
            data/forecasts/traffic_forecast.csv

          git add -u data/forecast_evaluations/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated CRZ model and forecast update"
            git push origin HEAD:main
          fi